name: Android TEST debug APK (no release)

on:
  workflow_dispatch:
  # Allows a first run before this workflow exists on the default branch.
  push:
    branches: [feature/italian-localization]
    paths: ['.github/workflows/build-android-test-apk.yml']

permissions:
  contents: read

concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/feature/italian-localization'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      # Public endpoints already declared by apps/mobile/eas.json.
      EXPO_PUBLIC_PB_URL: https://gym.guille.tech
      EXPO_PUBLIC_AI_API_URL: https://gym-server.guille.tech
      # No Sentry credentials or source-map upload for a debug build.
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a,armeabi-v7a
    steps:
      - name: Require private artifact access
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != 'true' ]; then
            echo '::error::Private test artifact required. Public-repository Actions artifacts are not owner-private. Use an authorized private repository containing this branch.'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Require authorized Firebase client configuration
        working-directory: apps/mobile
        env:
          TEST_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_TEST_GOOGLE_SERVICES_JSON }}
        run: |
          # Do not use the original configuration tracked in the source tree.
          rm -f google-services.json
          if [ -z "$TEST_GOOGLE_SERVICES_JSON" ]; then
            echo '::error::Missing ANDROID_TEST_GOOGLE_SERVICES_JSON. Supply only a legitimately authorized Firebase Android client configuration; no placeholders or copied original credentials.'
            exit 1
          fi
          umask 077
          printf '%s' "$TEST_GOOGLE_SERVICES_JSON" > google-services.json
          node - <<'NODE'
          const fs = require('node:fs');
          try {
            const c = JSON.parse(fs.readFileSync('google-services.json', 'utf8'));
            const pkg = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo.android.package;
            if (!c.project_info?.project_id || !c.project_info?.project_number ||
                !c.client?.some(x => x.client_info?.android_client_info?.package_name === pkg)) {
              throw new Error('invalid');
            }
          } catch {
            console.error('::error::Invalid Firebase Android client configuration or package mismatch (values withheld).');
            process.exit(1);
          }
          NODE

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify core and mobile
        run: |
          pnpm --filter @calistenia/core typecheck
          pnpm --filter @calistenia/mobile typecheck
          pnpm --filter @calistenia/core test
          pnpm --filter @calistenia/mobile test
          pnpm --filter @calistenia/mobile lint
      - name: Generate Android project without changing app configuration
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install
      - name: Assemble debug (Metro required at runtime)
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --parallel -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=4
      - name: Package TEST APK and checksum only
        run: |
          mkdir -p test-apk
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk test-apk/Calistenia-TEST-debug.apk
          cd test-apk
          sha256sum Calistenia-TEST-debug.apk > SHA256SUMS.txt
      - name: Upload temporary private run artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calistenia-TEST-debug-${{ github.run_id }}
          path: test-apk/
          if-no-files-found: error
          retention-days: 3
      - name: Remove supplied configuration
        if: always()
        run: rm -f apps/mobile/google-services.json apps/mobile/android/app/google-services.json
